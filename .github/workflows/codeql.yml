# CodeQL-tietoturva-analyysi selainkoodille (JavaScript). PHP:tä CodeQL ei tue –
# PHP katetaan PHPStanilla, Semgrepillä ja PHPUnit-tietoturvatesteillä (ci.yml).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL – JavaScript
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            paths-ignore:
              - public/assets/vendor
      - uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
